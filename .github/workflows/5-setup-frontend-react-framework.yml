name: Step 5 # Setup the React presentation tier

on:
  push:
    branches:
      - "build-octofit-app"
    paths:
      - "octofit-tracker/frontend/**"

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_6_FILE: ".github/steps/6-copilot-on-github.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.0

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.0

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise

      - name: Check api.js for codespace API URL logic
        id: check-api-url
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2.0.0
        with:
          text-file: octofit-tracker/frontend/src/api.js
          keyphrase: '-8000.app.github.dev'
          minimum-occurrences: 1
          case-sensitive: false

      - name: Check api.js for VITE_CODESPACE_NAME support
        id: check-vite-env
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2.0.0
        with:
          text-file: octofit-tracker/frontend/src/api.js
          keyphrase: 'VITE_CODESPACE_NAME'
          minimum-occurrences: 1
          case-sensitive: false

      - name: Check App.jsx uses API_BASE_URL
        id: check-app-api-base-url
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2.0.0
        with:
          text-file: octofit-tracker/frontend/src/App.jsx
          keyphrase: 'API_BASE_URL'
          minimum-occurrences: 1
          case-sensitive: false

      - name: Check App.jsx fetches users
        id: check-app-fetch-users
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2.0.0
        with:
          text-file: octofit-tracker/frontend/src/App.jsx
          keyphrase: 'fetchUsers()'
          minimum-occurrences: 1
          case-sensitive: false

      - name: Check App.jsx fetches activities
        id: check-app-fetch-activities
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2.0.0
        with:
          text-file: octofit-tracker/frontend/src/App.jsx
          keyphrase: 'fetchActivities()'
          minimum-occurrences: 1
          case-sensitive: false

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 5
            results_table:
              - description: "Check api.js for codespace API URL logic"
                passed: ${{ steps.check-api-url.outcome == 'success' }}
              - description: "Check api.js for VITE_CODESPACE_NAME support"
                passed: ${{ steps.check-vite-env.outcome == 'success' }}
              - description: "Check App.jsx uses API_BASE_URL"
                passed: ${{ steps.check-app-api-base-url.outcome == 'success' }}
              - description: "Check App.jsx fetches users"
                passed: ${{ steps.check-app-fetch-users.outcome == 'success' }}
              - description: "Check App.jsx fetches activities"
                passed: ${{ steps.check-app-fetch-activities.outcome == 'success' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.0

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 6

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_6_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{github.workflow}}"
          gh workflow enable "Step 6"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
